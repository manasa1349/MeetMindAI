services:
  mongo:
    image: mongo:7
    container_name: meetmind-mongo
    ports:
      - "27017:27017"
    volumes:
      - meetmind-mongo-data:/data/db

  backend:
    image: node:20-alpine
    container_name: meetmind-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "7000:7000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/meetmind-ai
      PORT: 7000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:2000
      FRONTEND_URLS: http://localhost:2000,http://localhost:5173
      JWT_SECRET: change-me-in-local-dev
    volumes:
      - ./backend:/app
    depends_on:
      - mongo

  frontend:
    image: node:20-alpine
    container_name: meetmind-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 2000"
    ports:
      - "2000:2000"
    environment:
      VITE_API_URL: http://localhost:7000/api
      VITE_SOCKET_URL: http://localhost:7000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  meetmind-mongo-data:
